[project]
name = "switchboard-llm"
version = "0.3.0"
description = "An LLM model brokerage: route tasks to the most efficient model, with task-type inference, cross-lab audits, escalation, provider failover, and per-task cost accounting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchboard = ["py.typed"]
